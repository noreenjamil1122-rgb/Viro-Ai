<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViroAI</title>
    <meta name="description" content="Your Intelligent Multi-Agent Social Media Business Assistant - an AI-driven multi-agent platform for content generation, image/video production, competitor intelligence, scheduling, and analytics." />
    <meta property="og:title" content="ViroAI" />
    <meta property="og:description" content="Your Intelligent Multi-Agent Social Media Business Assistant - an AI-driven multi-agent platform for content generation, image/video production, competitor intelligence, scheduling, and analytics." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <script>
      try {
        const savedTheme = localStorage.getItem('viroai_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
